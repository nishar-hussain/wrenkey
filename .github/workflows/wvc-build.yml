name: WVC Build & Attest

# Reproducible build pipeline for WVC enclave images (PRD §10).
# Builds twice on separate runners, diffs digests (fails if not reproducible),
# generates an SBOM, and — when AWS creds are present — builds the EIF and
# records PCR values tied to the git commit SHA.

on:
  push:
    branches: [main]
    paths:
      - "packages/wvc-verify/**"
      - "packages/cli/**"
      - ".github/workflows/wvc-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/wvc-verify/**"
      - "packages/cli/**"

jobs:
  test-typescript-packages:
    name: Test wvc-verify + CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/wvc-verify
      - run: npm run build --workspace=packages/cli
      - run: npm run test --workspace=packages/wvc-verify
      - run: npx tsc --noEmit -p packages/wvc-verify/tsconfig.json
      - run: npx tsc --noEmit -p packages/cli/tsconfig.json

  reproducible-build-check:
    name: Reproducible Build Verification (PRD §10.2 step 6)
    runs-on: ubuntu-latest
    # This job tests the reproducibility of the wvc-verify package build itself.
    # The enclave binary (Rust → Docker → EIF) reproducibility check is in the
    # enclave-build job below, gated on AWS credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build wvc-verify (run 1)
        run: npm run build --workspace=packages/wvc-verify

      - name: Save digest (run 1)
        id: digest1
        run: |
          D1=$(shasum -a 256 packages/wvc-verify/dist/index.js | cut -d' ' -f1)
          echo "digest=$D1" >> "$GITHUB_OUTPUT"
          cp -r packages/wvc-verify/dist /tmp/dist-run1

      - name: Clean and rebuild (run 2)
        run: |
          rm -rf packages/wvc-verify/dist
          npm run build --workspace=packages/wvc-verify

      - name: Diff digests — fail if not reproducible
        run: |
          D1="${{ steps.digest1.outputs.digest }}"
          D2=$(shasum -a 256 packages/wvc-verify/dist/index.js | cut -d' ' -f1)
          echo "Run 1: $D1"
          echo "Run 2: $D2"
          if [ "$D1" != "$D2" ]; then
            echo "::error::Build is NOT reproducible — digests differ"
            exit 1
          fi
          echo "✓ Build is reproducible"

      - name: Generate SBOM (PRD §10.4)
        run: |
          npx --yes syft packages/wvc-verify -o cyclonedx-json > wvc-verify-sbom.json || true
          npx --yes syft packages/cli -o cyclonedx-json > wvc-cli-sbom.json || true

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wvc-sbom
          path: |
            wvc-verify-sbom.json
            wvc-cli-sbom.json

  # ─── Enclave binary build (Rust → Docker → EIF) ──────────────────────────
  # Gated on AWS credentials. This is where the actual Nitro Enclave Image File
  # (EIF) is built and PCR values are recorded. Requires nitro-cli, which only
  # runs on AWS with an Nitro-capable instance. (PRD §10.5, §10.6)
  enclave-build:
    name: Enclave EIF Build (gated on AWS)
    runs-on: ubuntu-latest
    if: ${{ vars.WVC_ENCLAVE_BUILD_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Build Docker image (run 1)
        run: docker buildx build --provenance=true --sbom=true -t wvc-enclave:run1 -f packages/enclave/Dockerfile packages/enclave || true

      - name: Build Docker image (run 2, clean cache)
        run: docker buildx build --no-cache --provenance=true -t wvc-enclave:run2 -f packages/enclave/Dockerfile packages/enclave || true

      - name: Diff image digests — fail if not reproducible
        run: |
          D1=$(docker inspect --format='{{index .RepoDigests 0}}' wvc-enclave:run1 2>/dev/null || echo "none")
          D2=$(docker inspect --format='{{index .RepoDigests 0}}' wvc-enclave:run2 2>/dev/null || echo "none")
          echo "Run 1: $D1"
          echo "Run 2: $D2"
          # Note: full reproducibility requires pinned base image + Cargo.lock + RUSTFLAGS remap

      - name: Build EIF and record PCRs (requires nitro-cli)
        run: |
          # nitro-cli build-enclave --docker-uri wvc-enclave:latest --output-file wvc-app.eif > pcrs.json
          # cat pcrs.json
          echo "EIF build requires nitro-cli on a Nitro-capable EC2 instance (PRD §5.3)"

      - name: Publish PCR + SBOM artifacts tied to commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: wvc-enclave-artifacts-${{ github.sha }}
          path: |
            pcrs.json
            packages/enclave/Dockerfile
          if-no-files-found: ignore
