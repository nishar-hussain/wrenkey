services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wrankey
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/wrankey
      REDIS_URL: redis://redis:6379
      JWT_SECRET: changeme-in-production-use-random-string
      ENCRYPTION_KEY: changeme-in-production-use-32chars
      PORT: 3001
      HOST: 0.0.0.0
      ARC_RPC_URL: https://rpc.arc.network
      ARC_CHAIN_ID: 1234
      SESSION_EXPIRY_SECONDS: 3600
      API_KEY_EXPIRY_DAYS: 365
      OTP_EXPIRY_SECONDS: 300
      CORS_ORIGIN: http://localhost:5173,http://localhost:8080
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      FROM_EMAIL: no-reply@wrankey.io
      TWILIO_ACCOUNT_SID: ""
      TWILIO_AUTH_TOKEN: ""
      TWILIO_PHONE_NUMBER: ""
      OAUTH_GOOGLE_CLIENT_ID: ""
      OAUTH_GOOGLE_CLIENT_SECRET: ""
      WEBHOOK_HMAC_SECRET: changeme-in-production
      WEBAUTHN_RP_ID: localhost
      GAS_SPONSORSHIP_ENABLED: "false"
      GAS_SPONSORSHIP_MAX_AMOUNT: "0.01"
      GAS_SPONSORSHIP_WALLET_ID: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: packages/dashboard/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE: http://localhost:3001
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
