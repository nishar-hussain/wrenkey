[package]
name = "wvc-enclave"
version = "0.1.0"
edition = "2021"
description = "WranKey Verifiable Compute — AWS Nitro Enclave harness"

[[bin]]
name = "wvc-app"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
rand = { version = "0.8", features = ["std_rng"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem"] }
elliptic-curve = { version = "0.13", features = ["ecdh", "pem"] }
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
